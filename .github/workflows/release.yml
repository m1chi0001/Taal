name: Release Android APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Signed APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Validate Material 3 Expressive rules (if present)
        run: |
          if [ -f .antigravity/skills/material-3-expressive/scripts/validate_m3_expressive.py ]; then
            python3 .antigravity/skills/material-3-expressive/scripts/validate_m3_expressive.py
          else
            echo "Skipping M3 Expressive validation: script not present in repository."
          fi

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 is missing or empty."
            exit 1
          fi
          if [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "::error::One or more required signing secrets (ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD) are missing or empty."
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '\r\n' | base64 --decode > "${{ runner.temp }}/release.keystore"
          if [ ! -s "${{ runner.temp }}/release.keystore" ]; then
            echo "::error::Decoded release keystore is empty. Verify ANDROID_KEYSTORE_BASE64."
            exit 1
          fi

      - name: Build signed release APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Prepare release APK artifact
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' ! -name '*-unsigned.apk' | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "::error::No signed release APK found in app/build/outputs/apk/release/."
            ls -la app/build/outputs/apk/release/ || true
            exit 1
          fi
          cp "$APK_PATH" "${{ runner.temp }}/Taal-${{ github.ref_name }}.apk"
          echo "Prepared release APK: ${{ runner.temp }}/Taal-${{ github.ref_name }}.apk (from $APK_PATH)"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NOTES_FILE=".github/release-notes/${{ github.ref_name }}.md"
          if [ -f "$NOTES_FILE" ]; then
            # First line holds the release title (without a leading "# "), the rest is the body.
            TITLE=$(head -n 1 "$NOTES_FILE" | sed 's/^# *//')
            tail -n +2 "$NOTES_FILE" > "${{ runner.temp }}/release-notes.md"
            gh release create "${{ github.ref_name }}" \
              "${{ runner.temp }}/Taal-${{ github.ref_name }}.apk" \
              --title "$TITLE" \
              --notes-file "${{ runner.temp }}/release-notes.md"
          else
            gh release create "${{ github.ref_name }}" \
              "${{ runner.temp }}/Taal-${{ github.ref_name }}.apk" \
              --title "Taal ${{ github.ref_name }}" \
              --generate-notes
          fi

      - name: Clean up temporary keystore
        if: always()
        run: rm -f "${{ runner.temp }}/release.keystore"
